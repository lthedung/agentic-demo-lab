include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/strategy.yml

stages:
  - validate
  - build
  - deploy
  - strategy
  - rollback

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  extends:
    - .runner_01_job
  stage: validate
  script:
    - sh scripts/test.sh

build:
  extends:
    - .runner_01_job
    - .artifact_1_week
  stage: build
  needs:
    - test
  cache:
    key:
      files:
        - app/version.txt
    paths:
      - .demo-cache/
  script:
    - sh scripts/install-dependencies.sh
    - sh scripts/build.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - preview/

deploy_dev:
  extends:
    - .deploy_template
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - sh scripts/deploy-dev.sh
  artifacts:
    expire_in: 1 week
    paths:
      - preview/dev-release.txt

deploy_staging:
  extends:
    - .deploy_template
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - sh scripts/deploy-staging.sh
  artifacts:
    expire_in: 1 week
    paths:
      - preview/staging-release.txt

deploy_production:
  extends:
    - .deploy_template
    - .production_state_artifact
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never
  script:
    - sh scripts/deploy-production.sh

simulate_rolling_update:
  extends:
    - .strategy_template
  script:
    - sh scripts/simulate-rolling.sh

simulate_blue_green:
  extends:
    - .strategy_template
    - .blue_green_state_artifact
  script:
    - sh scripts/simulate-blue-green.sh

rollback_production:
  extends:
    - .runner_01_job
    - .production_state_artifact
  stage: rollback
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never
  script:
    - sh scripts/rollback-production.sh

rollback_blue_green:
  extends:
    - .runner_01_job
    - .blue_green_state_artifact
  stage: rollback
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - sh scripts/rollback-blue-green.sh
