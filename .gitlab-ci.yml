stages:
  - build
  - test
  - deploy
  - strategy
  - rollback

default:
  tags:
    - runner_01

build_demo:
  stage: build
  script:
    - sh scripts/build.sh
  artifacts:
    paths:
      - dist/

validate_demo:
  stage: test
  script:
    - sh scripts/test.sh

.deploy_template: &deploy_template
  stage: deploy
  artifacts:
    paths:
      - preview/
      - state/

.deploy_strategy_template: &deploy_strategy_template
  stage: strategy
  artifacts:
    paths:
      - preview/
      - state/

feature_validation:
  stage: test
  script:
    - echo "Feature branch validation only"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'

deploy_dev:
  <<: *deploy_template
  script:
    - sh scripts/deploy-dev.sh
  environment:
    name: dev
    url: https://example.invalid/dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_staging:
  <<: *deploy_template
  script:
    - sh scripts/deploy-staging.sh
  environment:
    name: staging
    url: https://example.invalid/staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_production:
  <<: *deploy_template
  script:
    - sh scripts/deploy-production.sh
  environment:
    name: production
    url: https://example.invalid/production
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'

simulate_rolling_update:
  <<: *deploy_strategy_template
  script:
    - sh scripts/simulate-rolling.sh
  environment:
    name: production
    url: https://example.invalid/production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual

simulate_blue_green:
  <<: *deploy_strategy_template
  script:
    - sh scripts/simulate-blue-green.sh
  environment:
    name: production
    url: https://example.invalid/production-green
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual

rollback_production:
  <<: *deploy_template
  stage: rollback
  needs:
    - job: deploy_production
      artifacts: true
  script:
    - sh scripts/rollback-production.sh
  environment:
    name: production
    url: https://example.invalid/production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual

rollback_blue_green:
  <<: *deploy_strategy_template
  stage: rollback
  needs:
    - job: simulate_blue_green
      artifacts: true
  script:
    - sh scripts/rollback-blue-green.sh
  environment:
    name: production
    url: https://example.invalid/production-blue
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual
