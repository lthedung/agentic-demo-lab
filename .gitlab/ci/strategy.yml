.strategy_template:
  extends:
    - .runner_01_job
  stage: strategy
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
    - when: never

.blue_green_state_artifact:
  extends:
    - .artifact_1_week
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: state/blue-green.env
    paths:
      - state/blue-green.env
